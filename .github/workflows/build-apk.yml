name: Build Xiaoya Live APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: stable

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The V0.1 source package intentionally keeps the Android platform
      # scaffold out of the source bundle. Generate it in CI before building.
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.xiaoyalive --project-name xiaoya_live .

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xiaoya-Live-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
